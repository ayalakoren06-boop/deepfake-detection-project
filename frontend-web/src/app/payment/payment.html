<div class="payment-wrapper">

  <div *ngIf="!isPaid" class="payment-card">
    <h2>Upgrade to DeepFence Pro</h2>
    <p class="subtitle">Pro plan - 100 scans every month</p>

    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Cardholder name</label>
        <input type="text" formControlName="fullName" placeholder="John Smith">
      </div>

      <div class="form-group">
        <label>Card number</label>
        <input type="text" formControlName="cardNumber" placeholder="0000 0000 0000 0000" maxlength="16" dir="ltr">
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label>Expiry (MM/YY)</label>
          <input type="text" formControlName="expiry" placeholder="12/26" maxlength="5" dir="ltr">
        </div>
        <div class="form-group half">
          <label>CVV</label>
          <input type="password" formControlName="cvv" placeholder="123" maxlength="4" dir="ltr">
        </div>
      </div>

      <p class="error-text" *ngIf="errorMessage">⚠️ {{ errorMessage }}</p>

      <button type="submit" class="btn-submit" [disabled]="isProcessing">
        <span *ngIf="!isProcessing">Pay now - ₪99.00</span>
        <span *ngIf="isProcessing">Processing secure payment...</span>
      </button>
    </form>
  </div>

  <div *ngIf="isPaid" class="success-card">
    <div class="icon-success">✓</div>
    <h2>Payment successful!</h2>
    <p>Thank you. Your account is now Pro, with 100 scans every month.</p>
    <button (click)="goToDashboard()" class="btn-primary">Back to dashboard</button>
  </div>

</div>
